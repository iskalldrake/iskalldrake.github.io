// Bygger en knapp: knapp("Text", vadSomHändsVidKlick)
function knapp(text, vidKlick) {
  const b = document.createElement("button");
  b.textContent = text;
  b.onclick = vidKlick;
  return b;
}

// Alla lägen. Lägger du till ett läge: skriv det här + en knapp med id="lage-NAMN".
const LAGEN = ["skriv", "omvant", "tid", "survivor", "quiz", "kort", "lista"];
function bytLage(nytt) {
  lage = nytt;
  serie = 0;     // byter du läge börjar en ny Survivor-omgång från noll
  LAGEN.forEach(l => document.getElementById("lage-" + l).classList.toggle("aktiv", nytt === l));
  uppdateraMenyEtikett();
  stangMeny();
  nastaFraga();
}
LAGEN.forEach(l => { document.getElementById("lage-" + l).onclick = () => bytLage(l); });

// Bygger temaknapparna. Första knappen är dina vanliga ord, sedan en per tema.
function byggTeman() {
  const rad = document.getElementById("teman");
  rad.innerHTML = "";
  const val = [{ namn: "", text: "📚 Mina ord (" + upplastaOrd().length + ")" },
               { namn: SVARA, text: "⚠️ Svåra ord (" + antalSvara() + ")" },
               ...teman.map(t => ({ namn: t.namn, text: t.ikon + " " + t.namn + " (" + t.ord.length + ")" }))];
  val.forEach(v => {
    const b = knapp(v.text, () => {
      valtTema = v.namn;
      lagra("danska-tema", valtTema);
      serie = 0;          // nytt tema = ny Survivor-omgång
      aktuellt = null;
      byggTeman();
      uppdateraMenyEtikett();
      stangMeny();
      nastaFraga();
    });
    if (v.namn === valtTema) b.classList.add("aktiv");
    rad.append(b);
  });
}

// =====================================================================
// 5. INTRON
// =====================================================================
// Välj intro: "ljus" (ett stearinljus tänds), "flagga" (danska flaggan ritas)
// eller "hej" (en hälsning skrivs ut). Tom text "" = ingen intro alls.
const INTRO = "flagga";   // vald 2026-11-14
// true = intron visas bara första gången per flik (inte när du laddar om sidan).
const INTRO_EN_GANG_PER_FLIK = false;

// Dansk hälsning efter tid på dygnet. Du lär dig lite danska redan i intron!
function halsning() {
  const h = new Date().getHours();
  if (h >= 5 && h < 10)  return ["Godmorgen!", "god morgon"];
  if (h >= 10 && h < 17) return ["Goddag!", "god dag"];
  if (h >= 17 && h < 23) return ["Godaften!", "god kväll"];
  return ["Godnat!", "god natt"];
}

// En kort rad om hur det går, t.ex. "🔥 5 dagar i rad · 40 ord upplåsta"
function introStatus() {
  const st = visadStreak();
  const delar = [];
  if (st > 0) delar.push("🔥 " + st + (st === 1 ? " dag" : " dagar") + " i rad");
  delar.push(upplastaOrd().length + " ord upplåsta");
  delar.push(upplastaOrd().filter(klarat).length + " klarade");
  return delar.join("  ·  ");
}

// Bygger intron som HTML-text. Varje stil har sina egna delar; texterna är gemensamma.
function byggIntro(stil) {
  const [hej, oversatt] = halsning();
  const texter = '<p class="intro-titel">Danska ord</p>' +
                 '<p class="intro-text">' + hej + ' <span>(' + oversatt + ')</span></p>' +
                 '<p class="intro-status">' + introStatus() + '</p>';
  if (stil === "ljus") {
    return '<div class="scen"><div class="ljus"><span class="sken"></span><span class="laga"></span>' +
           '<span class="veke"></span><span class="stearin"></span></div>' + texter + '</div>';
  }
  if (stil === "flagga") {
    return '<div class="scen"><div class="dk-flagga"><span class="kors-lodratt"></span>' +
           '<span class="kors-vagratt"></span></div>' + texter + '</div>';
  }
  // "hej": titeln skrivs ut bokstav för bokstav (se skrivUt nedan)
  return '<div class="scen"><p class="intro-titel"><span class="skrivtext"></span><span class="markor"></span></p>' +
         '<p class="intro-text">' + hej + ' <span>(' + oversatt + ')</span></p>' +
         '<p class="intro-status">' + introStatus() + '</p></div>';
}

// Skriver ut en text bokstav för bokstav i ett element, som en skrivmaskin.
function skrivUt(element, text, msPerBokstav) {
  let i = 0;
  const klocka = setInterval(() => {
    i++;
    element.textContent = text.slice(0, i);
    if (i >= text.length) clearInterval(klocka);
  }, msPerBokstav);
}

let introSlut = false;
function avslutaIntro() {
  if (introSlut) return;          // redan avslutad? gör inget mer
  introSlut = true;
  const ruta = document.getElementById("intro");
  document.body.classList.add("startad");   // märker att sidan har startat
  if (ruta) {
    // Intron tonas bort med JavaScript ("Web Animations"): opacitet 1 -> 0 på 0,6 s.
    // fill: "forwards" = stanna kvar på 0 när toningen är klar.
    // (Förut gjordes toningen i CSS med opacity + visibility. Då visade Firefox
    //  hela intron igen i en enda bildruta precis när toningen tog slut – hacket.)
    ruta.style.animation = "none";          // stäng av nödstoppet i CSS, vi sköter det nu
    ruta.style.pointerEvents = "none";      // klick går rakt igenom till sidan direkt
    const tona = ruta.animate([{ opacity: 1 }, { opacity: 0 }],
                              { duration: 600, easing: "ease", fill: "forwards" });
    tona.onfinish = () => {
      ruta.style.display = "none";          // göm helt...
      requestAnimationFrame(() => ruta.remove());   // ...och ta bort vid nästa bildruta
    };
  }
  const falt = innehall.querySelector("input");
  if (falt) falt.focus();
}

function korIntro() {
  const ruta = document.getElementById("intro");
  let redanVisad = false;
  try { redanVisad = sessionStorage.getItem("danska-intro") === "ja"; } catch (e) {}
  if (!INTRO || !ruta || (INTRO_EN_GANG_PER_FLIK && redanVisad)) {
    if (ruta) ruta.remove();
    document.body.classList.add("startad");
    return;
  }
  try { sessionStorage.setItem("danska-intro", "ja"); } catch (e) {}

  // Vill datorn ha mindre rörelse? Då blir intron bara en kort toning.
  const lugn = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  ruta.dataset.stil = INTRO;
  ruta.innerHTML = byggIntro(INTRO);
  if (INTRO === "hej" && !lugn) {
    setTimeout(() => skrivUt(ruta.querySelector(".skrivtext"), "Danska ord", 85), 250);
  } else if (INTRO === "hej") {
    ruta.querySelector(".skrivtext").textContent = "Danska ord";
  }

  // Intron slutar när BÅDA är klara: tiden har gått OCH typsnitten har laddats
  // (men vi väntar aldrig mer än 3 sekunder extra på typsnitten).
  // Ett "Promise" är ett löfte om att något blir klart senare.
  const langd = lugn ? 500 : ({ ljus: 2300, flagga: 2200, hej: 2500 }[INTRO] || 2000);
  const tiden = new Promise(klar => setTimeout(klar, langd));
  // Vi ber uttryckligen om ALLA varianter av typsnitten som sidan använder (fet,
  // kursiv osv.). Annars kan Firefox ladda någon av dem först EFTER intron, och då
  // byts texten plötsligt ut – det ser ut som ett litet hack.
  const varianter = ["600 1em Fraunces", "500 1em Fraunces", "italic 400 1em Fraunces",
                     "400 1em Inter", "600 1em Inter", "700 1em Inter"];
  const typsnitt = document.fonts
    ? Promise.all(varianter.map(v => document.fonts.load(v).catch(() => null))).then(() => document.fonts.ready)
    : Promise.resolve();
  const maxVanta = new Promise(klar => setTimeout(klar, langd + 3000));
  Promise.all([tiden, Promise.race([typsnitt, maxVanta])]).then(avslutaIntro);

  // Klick eller tangent = hoppa över intron
  ruta.addEventListener("click", avslutaIntro);
  document.addEventListener("keydown", avslutaIntro, { once: true });
}

// =====================================================================
// 6. MENYN (läge, öva på och statistik)
// =====================================================================
// Menyn öppnas och stängs med en liten animation. Vi använder JavaScript
// ("element.animate") i stället för CSS-övergångar, eftersom Firefox annars
// kan blinka till när något göms (samma problem som vi hade med intron).
const meny = document.getElementById("meny");
const menyKnapp = document.getElementById("meny-knapp");
let menyOppen = false;
let stangAnimation = null;   // stängningsanimationen, om den pågår just nu

const LAGESNAMN = { skriv: "✍️ Skriv", omvant: "🔄 Omvänt", tid: "⏱️ Tidspress", survivor: "🎯 Survivor", quiz: "❓ Quiz",
                    kort: "🃏 Flashcards", lista: "📖 Ordlista" };

// Texten på menyknappen, t.ex. "✍️ Skriv · 🎨 Färger"
function uppdateraMenyEtikett() {
  const tema = teman.find(t => t.namn === valtTema);
  document.getElementById("meny-etikett").textContent =
    LAGESNAMN[lage] + " · " + (valtTema === SVARA ? "⚠️ Svåra ord" : tema ? tema.ikon + " " + tema.namn : "📚 Mina ord");
}

function oppnaMeny() {
  if (menyOppen) return;
  menyOppen = true;
  menyKnapp.setAttribute("aria-expanded", "true");
  // Håller menyn fortfarande på att stängas? Avbryt det, annars göms den
  // när stängningen blir klar – mitt i att vi öppnar den igen.
  if (stangAnimation) { stangAnimation.onfinish = null; stangAnimation.cancel(); stangAnimation = null; }
  meny.style.display = "block";
  // Glider ner lite och tonar fram: från osynlig och 8 px upp, till synlig på plats.
  meny.animate([{ opacity: 0, transform: "translateY(-8px) scale(.98)" },
                { opacity: 1, transform: "none" }],
               { duration: 180, easing: "ease-out" });
}

function stangMeny() {
  if (!menyOppen) return;
  menyOppen = false;
  menyKnapp.setAttribute("aria-expanded", "false");
  const anim = stangAnimation = meny.animate([{ opacity: 1, transform: "none" },
                             { opacity: 0, transform: "translateY(-8px) scale(.98)" }],
                            { duration: 140, easing: "ease-in", fill: "forwards" });
  anim.onfinish = () => {
    meny.style.display = "none";   // göm helt när den är osynlig...
    anim.cancel();                 // ...och släpp "fill", så den kan visas igen nästa gång
    stangAnimation = null;
  };
  // Tillbaka till skrivfältet, så du kan fortsätta skriva direkt
  const falt = innehall.querySelector("input:not([readonly])");
  if (falt) falt.focus({ preventScroll: true });
}

// Klick på knappen: öppna om stängd, stäng om öppen
menyKnapp.onclick = e => { e.stopPropagation(); menyOppen ? stangMeny() : oppnaMeny(); };
// Klick någon annanstans på sidan stänger menyn
document.addEventListener("click", e => { if (menyOppen && !meny.contains(e.target)) stangMeny(); });
// Esc stänger menyn
document.addEventListener("keydown", e => { if (e.key === "Escape") stangMeny(); });

// =====================================================================
// 7. SÄKERHETSKOPIA (spara och läs in framstegen som en fil)
// =====================================================================
// Framstegen ligger i webbläsarens localStorage och följer INTE med via Git.
// Med de här knapparna kan du spara allt i en liten fil (JSON = text med
// {namn: värde}) och läsa in den på en annan dator eller i en annan webbläsare.
// Här är alla namn vi sparar under:
const SPARNYCKLAR = ["danska-lador", "danska-framsteg", "danska-rekord", "danska-tema",
                     "danska-tid-sekunder", "danska-rekord-tid"];
const kopiaInfo = document.getElementById("kopia-info");

// SPARA: bygg ett objekt med allt, gör om det till text och "ladda ner" det.
// En "Blob" är en fil som bara finns i minnet. Vi gör en osynlig länk till den
// och klickar på länken, då sparar webbläsaren filen i Hämtade filer / Downloads.
document.getElementById("kopia-spara").onclick = () => {
  const data = { app: "danska-ord", sparad: new Date().toISOString(), varden: {} };
  SPARNYCKLAR.forEach(n => { const v = hamta(n); if (v !== null) data.varden[n] = v; });
  const fil = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const lank = document.createElement("a");
  lank.href = URL.createObjectURL(fil);
  lank.download = "danska-framsteg-" + datum() + ".json";
  document.body.append(lank);
  lank.click();
  lank.remove();
  setTimeout(() => URL.revokeObjectURL(lank.href), 1000);   // släpp minnet efter en stund
  kopiaInfo.textContent = "Sparad som " + lank.download + " i din mapp för nedladdningar.";
};

// LÄS IN: knappen öppnar den gömda filväljaren.
document.getElementById("kopia-las").onclick = () => document.getElementById("kopia-fil").click();

// När du valt en fil: läs den, kolla att den är från den här appen, fråga om
// du verkligen vill byta ut dina framsteg, spara och ladda om sidan.
document.getElementById("kopia-fil").onchange = async e => {
  const fil = e.target.files[0];
  e.target.value = "";                 // så att samma fil kan väljas igen senare
  if (!fil) return;
  let data;
  try { data = JSON.parse(await fil.text()); } catch (fel) { data = null; }
  if (!data || data.app !== "danska-ord" || typeof data.varden !== "object") {
    kopiaInfo.textContent = "⚠️ Det där är ingen säkerhetskopia från Danska ord.";
    return;
  }
  // Visa vad filen innehåller, så att du vet vad du byter till
  let iFilen = "";
  try {
    const f = JSON.parse(data.varden["danska-framsteg"]);
    iFilen = "\n\nI filen: " + f.upplasta + " ord upplåsta, " + f.streak + " dagar i rad (senast övad " + f.senastOvad + ").";
  } catch (fel) {}
  const ok = confirm("Byta ut framstegen i den här webbläsaren mot filen?" + iFilen +
                     "\n\nTips: spara först en kopia av det du har nu om du är osäker.");
  if (!ok) return;
  SPARNYCKLAR.forEach(n => {
    if (n in data.varden) lagra(n, data.varden[n]);
    else { try { localStorage.removeItem(n); } catch (fel) {} }
  });
  location.reload();                   // ladda om sidan så att allt läses in på nytt
};

// =====================================================================
// 8. KONTO OCH MOLNET (frivilligt, via Firebase)
// =====================================================================
// Utan konto sparas allt i webbläsarens localStorage, precis som förut.
// Med ett konto sparas framstegen OCKSÅ i molnet hos Firebase (en gratis tjänst
// från Google). Då kan du öva på mobilen och datorn med samma framsteg, och de
// finns kvar även om du rensar webbläsaren.
//
// Hur pratar sidan med Firebase? Med vanliga fetch-anrop (samma sak som när en
// webbsida hämtar något från internet), utan något extra bibliotek:
//   * identitytoolkit.googleapis.com  = inloggningen (mejl + lösenord)
//   * securetoken.googleapis.com      = byter en gammal "biljett" mot en ny
//   * firestore.googleapis.com        = databasen där framstegen ligger
//
// BILJETTER: när du loggar in får sidan två saker av Firebase:
//   idToken      = en biljett som gäller i 1 timme. Den visas för databasen.
//   refreshToken = används för att få en ny idToken när den gamla gått ut.
// refreshToken sparas i localStorage ("danska-konto"), så att du är inloggad
// nästa gång. Lösenordet sparas ALDRIG, det skickas bara till Firebase.
//
// Varje person har ett eget dokument: framsteg/<ditt användar-id>.
// Reglerna i Firebase (se LASMIG.md) gör att bara DU kan läsa och skriva det.
//
// Inställningarna (apiKey och projectId) ligger i firebase-installning.js.
// apiKey är INGEN hemlighet: den talar bara om vilket Firebase-projekt sidan
// hör till. Skyddet sitter i reglerna, inte i nyckeln.
const FB = window.FIREBASE || {};
const MOLN_PA = Boolean(FB.apiKey && FB.projectId);   // är molnet inställt?
const SYNK_AUTO = true;   // true = hämta när sidan öppnas, spara 10 s efter att du svarat

const kontoStatusRuta = document.getElementById("konto-status");
function synkStatus(text) { kontoStatusRuta.textContent = text; }

// Felkoder från Firebase -> svenska. Koden kastar t.ex. new Error("natet").
const KONTO_FEL = {
  "EMAIL_EXISTS": "Det finns redan ett konto med den mejladressen. Klicka Logga in i stället.",
  "INVALID_EMAIL": "Mejladressen ser inte rätt ut.",
  "MISSING_PASSWORD": "Skriv ett lösenord.",
  "WEAK_PASSWORD": "Lösenordet är för kort. Det måste vara minst 6 tecken.",
  "INVALID_LOGIN_CREDENTIALS": "Fel mejl eller lösenord.",
  "EMAIL_NOT_FOUND": "Fel mejl eller lösenord.",
  "INVALID_PASSWORD": "Fel mejl eller lösenord.",
  "USER_DISABLED": "Kontot är avstängt.",
  "TOO_MANY_ATTEMPTS_TRY_LATER": "För många försök. Vänta en stund och prova igen.",
  "OPERATION_NOT_ALLOWED": "Inloggning med mejl är inte påslagen i Firebase än.",
  "utloggad": "Du har blivit utloggad. Logga in igen.",
  "nej": "Molnet sa nej (kolla reglerna i Firebase).",
  "natet": "Kom inte fram till molnet. Är du ansluten till internet?",
  "trasig": "Det som låg i molnet gick inte att läsa.",
};
function felText(e) { return KONTO_FEL[e.message] || e.message; }

// ---------- Inloggningen ----------
// Det vi kommer ihåg om kontot: { mejl, uid, refresh }. uid = ditt användar-id.
function konto() {
  try { return JSON.parse(hamta("danska-konto")) || null; } catch (e) { return null; }
}
let biljett = null, biljettGaller = 0;   // idToken och när den slutar gälla (bara i minnet)

// Skickar ett anrop till Firebase och packar upp svaret (JSON).
// Firebase skickar fel som { error: { message: "EMAIL_EXISTS" } }.
async function firebase(url, kropp, formular = false) {
  let svar;
  try {
    svar = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": formular ? "application/x-www-form-urlencoded" : "application/json" },
      body: formular ? new URLSearchParams(kropp) : JSON.stringify(kropp),
    });
  } catch (e) { throw new Error("natet"); }
  const data = await svar.json().catch(() => ({}));
  if (!svar.ok) {
    // T.ex. "WEAK_PASSWORD : Password should be at least 6 characters" -> "WEAK_PASSWORD"
    const kod = String((data.error && data.error.message) || svar.status).split(" ")[0];
    throw new Error(kod);
  }
  return data;
}
const INLOGG = "https://identitytoolkit.googleapis.com/v1/accounts:";

// Spara det Firebase gav oss efter inloggning eller ny biljett.
function kommIhag(mejl, uid, refresh, idToken, sekunder) {
  lagra("danska-konto", JSON.stringify({ mejl, uid, refresh }));
  biljett = idToken;
  biljettGaller = Date.now() + (Number(sekunder) || 3600) * 1000;
}

// Logga in (ny = false) eller skapa ett nytt konto (ny = true).
async function loggaIn(mejl, losen, ny) {
  const d = await firebase(INLOGG + (ny ? "signUp" : "signInWithPassword") + "?key=" + FB.apiKey,
                           { email: mejl, password: losen, returnSecureToken: true });
  kommIhag(d.email || mejl, d.localId, d.refreshToken, d.idToken, d.expiresIn);
}

// Ge en färsk idToken. Är den gamla (nästan) slut byter vi refreshToken mot en ny.
async function giltigBiljett() {
  const k = konto();
  if (!k) throw new Error("utloggad");
  if (biljett && Date.now() < biljettGaller - 60000) return biljett;
  let d;
  try {
    d = await firebase("https://securetoken.googleapis.com/v1/token?key=" + FB.apiKey,
                       { grant_type: "refresh_token", refresh_token: k.refresh }, true);
  } catch (e) {
    if (e.message === "natet") throw e;
    glomKontot();                       // biljetten går inte att förnya (lösenordet bytt, kontot raderat ...)
    throw new Error("utloggad");
  }
  kommIhag(k.mejl, d.user_id, d.refresh_token, d.id_token, d.expires_in);
  return biljett;
}

function glomKontot() {
  biljett = null;
  try { localStorage.removeItem("danska-konto"); localStorage.removeItem("danska-synk-senast"); } catch (e) {}
  visaKonto();
}

// ---------- Databasen (Firestore) ----------
// Ditt dokument har två fält: paket (alla framsteg som text) och sparad (när).
function dokUrl() {
  return "https://firestore.googleapis.com/v1/projects/" + FB.projectId +
         "/databases/(default)/documents/framsteg/" + konto().uid;
}
async function databas(metod, kropp, forsok = 1) {
  const token = await giltigBiljett();
  let svar;
  try {
    svar = await fetch(dokUrl(), {
      method: metod, cache: "no-store",
      headers: { Authorization: "Bearer " + token, ...(kropp ? { "Content-Type": "application/json" } : {}) },
      body: kropp ? JSON.stringify(kropp) : undefined,
    });
  } catch (e) { throw new Error("natet"); }
  // 401 = biljetten dög inte. Hämta en ny och försök en gång till.
  if (svar.status === 401 && forsok > 0) { biljett = null; return databas(metod, kropp, forsok - 1); }
  if (svar.status === 404) return null;      // inget sparat i molnet än
  if (svar.status === 401) throw new Error("utloggad");
  if (svar.status === 403) throw new Error("nej");
  if (!svar.ok) throw new Error("Molnet svarade " + svar.status);
  return svar.json();
}

// Läs paketet ur molnet (null om inget finns)
async function lasMolnet() {
  const dok = await databas("GET");
  const text = dok && dok.fields && dok.fields.paket && dok.fields.paket.stringValue;
  if (!text) return null;
  try { return JSON.parse(text); } catch (e) { throw new Error("trasig"); }
}
// Spara paketet i molnet. PATCH utan fältlista = ersätt hela dokumentet (skapa om det saknas).
function skrivMolnet(paket) {
  return databas("PATCH", { fields: {
    paket: { stringValue: JSON.stringify(paket) },
    sparad: { timestampValue: new Date().toISOString() },
  } });
}

// ---------- Slå ihop ----------
// Vilken sorts enhet är det här? Visas som "sparat från mobilen".
function datornamn() {
  const p = (navigator.userAgent || "").toLowerCase();
  if (p.includes("iphone") || (p.includes("android") && p.includes("mobile"))) return "mobilen";
  if (p.includes("ipad") || p.includes("android")) return "surfplattan";
  return p.includes("windows") ? "Windows" : p.includes("mac") ? "Mac" : p.includes("linux") ? "Linux" : "en annan enhet";
}

// Paketet som sparas i molnet
function synkPaket() {
  return { app: "danska-ord", sparad: new Date().toISOString(), fran: datornamn(),
           lador, framsteg, rekord, rekordTid };
}

// SLÅ IHOP ett paket från molnet med det som finns här. Svarar med antal ord som ändrades.
// Ingenting skrivs över i onödan: för varje ord vinner den enhet som övade på ordet
// SENAST (framsteg.andrad), och för nivån, rekorden och dagboken tar vi det största.
function slaIhop(f) {
  if (!f || f.app !== "danska-ord") throw new Error("trasig");
  const fLador = f.lador || {}, fFram = f.framsteg || {};
  const fIRad = fFram.iRad || {}, fAndrad = fFram.andrad || {};
  // Övade den andra enheten senare än den här? Används när ett ord saknar tidsstämpel.
  const fjarrNyare = (fFram.senastOvad || "") > (framsteg.senastOvad || "");
  let andrade = 0;

  new Set([...Object.keys(fLador), ...Object.keys(fIRad)]).forEach(da => {
    const minTid = framsteg.andrad[da] || 0, deras = fAndrad[da] || 0;
    const finnsHar = da in lador || da in framsteg.iRad;
    const taDeras = deras > minTid || (!finnsHar) || (deras === 0 && minTid === 0 && fjarrNyare);
    if (!taDeras) return;
    const nyLada = fLador[da] || 0, nyIRad = fIRad[da] || 0;
    if ((lador[da] || 0) !== nyLada || (framsteg.iRad[da] || 0) !== nyIRad) andrade++;
    lador[da] = nyLada;
    framsteg.iRad[da] = nyIRad;
    if (deras) framsteg.andrad[da] = deras;
  });

  // Nivån: den största vinner
  framsteg.upplasta = Math.max(framsteg.upplasta || 0, fFram.upplasta || 0);
  // Dagboken: för varje dag tar vi den som har flest svar
  Object.entries(fFram.historik || {}).forEach(([dag, d]) => {
    if (!framsteg.historik[dag] || d.svar > framsteg.historik[dag].svar) framsteg.historik[dag] = d;
  });
  const dagar = Object.keys(framsteg.historik).sort();
  while (dagar.length > 60) delete framsteg.historik[dagar.shift()];
  // Dagsstreaken: den enhet som övade senast vet bäst
  if (fjarrNyare) { framsteg.streak = fFram.streak || 0; framsteg.senastOvad = fFram.senastOvad; }
  else if (fFram.senastOvad === framsteg.senastOvad) framsteg.streak = Math.max(framsteg.streak, fFram.streak || 0);
  // Rekorden: det största vinner
  rekord = Math.max(rekord, Number(f.rekord) || 0);
  Object.entries(f.rekordTid || {}).forEach(([sek, r]) => { rekordTid[sek] = Math.max(rekordTid[sek] || 0, r); });

  spara();
  sparaFramsteg();
  lagra("danska-rekord", rekord);
  lagra("danska-rekord-tid", JSON.stringify(rekordTid));
  return andrade;
}

// "13.05" eller "igår 21.40" eller "2026-11-12 08.15"
function narText(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const kl = String(d.getHours()).padStart(2, "0") + "." + String(d.getMinutes()).padStart(2, "0");
  const dagText = d.toLocaleDateString("sv-SE");
  const dag = dagText === datum() ? "idag" : dagText === datum(-1) ? "igår" : dagText;
  return dag + " " + kl;
}

// Efter en synk: rita om sidan med de nya siffrorna (ordet du övar på ligger kvar).
function ritaOm() {
  byggTeman();
  uppdateraStats();
  const upp = forsokLasaUpp();          // kanske har du klarat nivån på en annan enhet
  if (upp.trim()) document.getElementById("meddelande").textContent = upp.trim();
}

// SYNKA = hämta molnet, slå ihop med det som finns här, spara allt tillbaka.
// tyst = true när det sker automatiskt (då visas bara en kort rad).
let synkUpptagen = false, synkIgen = false;
async function synka(tyst) {
  if (!MOLN_PA || !konto()) return;
  if (synkUpptagen) { synkIgen = true; return; }   // kör en gång till när den här är klar
  synkUpptagen = true;
  if (!tyst) synkStatus("Synkar…");
  try {
    const deras = await lasMolnet();
    let andrade = 0;
    if (deras) { andrade = slaIhop(deras); ritaOm(); }
    await skrivMolnet(synkPaket());
    lagra("danska-synk-senast", new Date().toISOString());
    const fran = deras && deras.fran && andrade ? " (från " + deras.fran + ")" : "";
    synkStatus("☁️ Inloggad som " + konto().mejl + ". Sparat i molnet " + narText(new Date().toISOString()) + " ✓" +
               (andrade ? " " + andrade + " ord uppdaterade" + fran + "." : ""));
  } catch (e) {
    if (konto()) synkStatus("⚠️ " + felText(e) + " Framstegen finns kvar här i webbläsaren.");
    else synkStatus("⚠️ " + felText(e));
  }
  synkUpptagen = false;
  if (synkIgen) { synkIgen = false; synka(true); }
}

// Automatisk sparning 10 sekunder efter ditt senaste svar (en gång per paus, inte per ord).
// registrera() i avsnitt 2 anropar synkSnart() efter varje svar.
let synkTimer = null;
function synkSnart() {
  if (!SYNK_AUTO || !MOLN_PA || !konto()) return;
  clearTimeout(synkTimer);
  synkTimer = setTimeout(() => { synkTimer = null; synka(true); }, 10000);
}
// Stänger du fliken eller byter app medan en sparning väntar? Spara direkt.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && synkTimer) {
    clearTimeout(synkTimer);
    synkTimer = null;
    synka(true);
  }
});

// ---------- Knapparna i menyn ----------
const kontoForm = document.getElementById("konto-form");
const mejlFalt = document.getElementById("konto-mejl");
const losenFalt = document.getElementById("konto-losen");

// Visar rätt knappar beroende på om du är inloggad eller inte
function visaKonto() {
  const k = konto();
  document.getElementById("konto-utloggad").hidden = !MOLN_PA || Boolean(k);
  document.getElementById("konto-inloggad").hidden = !MOLN_PA || !k;
  if (k) kontoForm.hidden = true;
  if (!MOLN_PA) synkStatus("Dina framsteg sparas automatiskt i den här webbläsaren. (Inloggning är inte påslagen på sidan än.)");
  else if (!k) synkStatus("Dina framsteg sparas automatiskt i den här webbläsaren. Vill du öva på flera enheter, eller vara säker på att inget försvinner om du rensar webbläsaren? Skapa ett gratis konto. Det är helt frivilligt.");
  else if (hamta("danska-synk-senast")) synkStatus("☁️ Inloggad som " + k.mejl + ". Senast sparat i molnet " + narText(hamta("danska-synk-senast")) + ".");
  else synkStatus("☁️ Inloggad som " + k.mejl + ".");
}

document.getElementById("konto-visa-form").onclick = () => {
  kontoForm.hidden = !kontoForm.hidden;
  if (!kontoForm.hidden) mejlFalt.focus();
};

// Gemensamt för Logga in och Skapa konto
async function kontoKnapp(ny) {
  const mejl = mejlFalt.value.trim(), losen = losenFalt.value;
  if (!mejl || !losen) { synkStatus("Skriv mejladress och lösenord."); return; }
  if (ny && losen.length < 6) { synkStatus("Lösenordet måste vara minst 6 tecken."); return; }
  synkStatus(ny ? "Skapar kontot…" : "Loggar in…");
  try {
    await loggaIn(mejl, losen, ny);
  } catch (e) { synkStatus("⚠️ " + felText(e)); return; }
  losenFalt.value = "";
  visaKonto();
  synka(false);      // slå ihop det du har här med det som redan ligger i molnet
}
// submit = Enter i formuläret eller klick på "Logga in"
kontoForm.onsubmit = e => { e.preventDefault(); kontoKnapp(false); };
document.getElementById("konto-skapa").onclick = () => kontoKnapp(true);

// Glömt lösenordet: Firebase skickar ett mejl med en länk där man väljer ett nytt
document.getElementById("konto-glomt").onclick = async () => {
  const mejl = mejlFalt.value.trim();
  if (!mejl) { synkStatus("Skriv din mejladress först, klicka sedan Glömt lösenordet igen."); mejlFalt.focus(); return; }
  try {
    await firebase(INLOGG + "sendOobCode?key=" + FB.apiKey, { requestType: "PASSWORD_RESET", email: mejl });
  } catch (e) {
    if (e.message === "natet" || e.message === "INVALID_EMAIL" || e.message.startsWith("TOO_MANY")) {
      synkStatus("⚠️ " + felText(e)); return;
    }
  }
  // Samma svar oavsett om kontot finns, så att ingen kan testa vilka mejl som har konto
  synkStatus("Om det finns ett konto för " + mejl + " kommer ett mejl med en länk för nytt lösenord. Kolla skräpposten också.");
};

document.getElementById("konto-synka").onclick = () => synka(false);

document.getElementById("konto-logga-ut").onclick = async () => {
  clearTimeout(synkTimer); synkTimer = null;
  await synka(true);   // spara det sista innan vi loggar ut
  const rensa = confirm("Du loggas ut. Dina framsteg finns kvar i molnet.\n\n" +
    "Vill du också ta bort framstegen från den här webbläsaren? Välj OK på en dator som andra använder, " +
    "Avbryt om det är din egen.");
  glomKontot();
  if (rensa) {
    SPARNYCKLAR.forEach(n => { try { localStorage.removeItem(n); } catch (e) {} });
    location.reload();
  }
};

document.getElementById("konto-radera").onclick = async () => {
  if (!confirm("Radera kontot och allt som sparats i molnet? Det går inte att ångra.\n\n" +
               "Framstegen i den här webbläsaren finns kvar.")) return;
  clearTimeout(synkTimer); synkTimer = null;
  synkStatus("Raderar…");
  try {
    await databas("DELETE");                               // först framstegen i molnet
    await firebase(INLOGG + "delete?key=" + FB.apiKey, { idToken: await giltigBiljett() });  // sedan kontot
  } catch (e) {
    // Firebase vill att man loggat in nyligen för att få radera kontot
    if (e.message === "CREDENTIAL_TOO_OLD_LOGIN_AGAIN") {
      glomKontot();
      synkStatus("Av säkerhetsskäl: logga in igen och klicka Radera kontot direkt efteråt.");
    } else synkStatus("⚠️ " + felText(e));
    return;
  }
  glomKontot();
  synkStatus("Kontot och framstegen i molnet är borttagna. Det du har här i webbläsaren finns kvar.");
};

visaKonto();

// =====================================================================
// 9. FIRANDET (när du klarar en nivå och 10 nya ord låses upp)
// =====================================================================
// Ett stearinljus tänds, gnistor flyger och du ser de 10 nya orden.
// Klick, Enter eller Esc stänger.
let festOppen = false;
function fira() {
  if (festOppen) return;
  festOppen = true;
  clearTimeout(autoTimer);
  const nya = ORD.slice(Math.max(0, framsteg.upplasta - NYA_PER_OMGANG), framsteg.upplasta);
  const ruta = document.createElement("div");
  ruta.id = "fest";
  ruta.setAttribute("role", "dialog");
  ruta.setAttribute("aria-label", "Ny nivå");

  // Gnistorna: 8 st, var och en åt sitt håll (--x) och med lite olika fördröjning
  let gnistor = "";
  for (let i = 0; i < 8; i++) {
    gnistor += '<span class="gnista" style="--x:' + (i * 22 - 77) + 'px; animation-delay:' +
               (0.8 + i * 0.17).toFixed(2) + 's"></span>';
  }
  ruta.innerHTML =
    '<div class="scen">' +
      '<div class="ljus"><span class="sken"></span><span class="laga"></span>' +
      '<span class="veke"></span><span class="stearin"></span>' + gnistor + '</div>' +
      '<p class="fest-titel">Godt klaret!</p>' +
      '<p class="fest-text">Nivå ' + (niva() - 1) + ' klar · ' + nya.length + ' nya ord upplåsta</p>' +
      '<div class="fest-ord"></div>' +
      '<button class="primar">Fortsätt (Enter)</button>' +
    '</div>';
  // Orden läggs in med textContent (säkert, ord.js kan innehålla vilka tecken som helst)
  const ordRuta = ruta.querySelector(".fest-ord");
  nya.forEach(o => {
    const s = document.createElement("span");
    const b = document.createElement("b"); b.textContent = o.da;
    const i = document.createElement("i"); i.textContent = " " + o.sv;
    s.append(b, i);
    ordRuta.append(s);
  });
  document.body.append(ruta);
  ruta.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, easing: "ease" });

  const knappen = ruta.querySelector("button");
  if (document.activeElement) document.activeElement.blur();   // så att Enter inte går till skrivfältet
  setTimeout(() => knappen.focus(), 50);

  function stang() {
    if (!festOppen) return;
    festOppen = false;
    document.removeEventListener("keydown", tangent);
    // Tonas bort med JavaScript (Firefox-säkert, se avslutaIntro)
    const tona = ruta.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 350, easing: "ease", fill: "forwards" });
    tona.onfinish = () => { ruta.style.display = "none"; requestAnimationFrame(() => ruta.remove()); };
    const falt = innehall.querySelector("input");
    if (falt) falt.focus({ preventScroll: true });
  }
  function tangent(e) {
    if (e.key === "Enter" || e.key === "Escape" || e.key === " ") { e.preventDefault(); stang(); }
  }
  ruta.addEventListener("click", stang);
  document.addEventListener("keydown", tangent);
}

// STARTSKOTT: har du redan klarat alla upplåsta ord låses nästa omgång upp direkt.
const startUpplast = forsokLasaUpp();
document.getElementById("meddelande").textContent = startUpplast.trim();
byggTeman();
uppdateraMenyEtikett();
nastaFraga();
korIntro();
// Inloggad? Hämta det senaste från molnet när sidan öppnas
if (SYNK_AUTO && MOLN_PA && konto()) setTimeout(() => synka(true), 1500);
